name: Windows build and smoke tests
on:
  push:
  workflow_dispatch:
  pull_request:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test core
        run: dotnet run --project tests/LanBridge.SmokeTests/LanBridge.SmokeTests.csproj -c Release
      - name: Publish Windows x64
        shell: pwsh
        run: |
          dotnet publish src/LanBridge.Desktop/LanBridge.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishTrimmed=false -o artifacts/publish
          Copy-Item scripts/firewall.ps1 artifacts/publish/firewall.ps1 -Force
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Compile Windows installer
        shell: pwsh
        run: |
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' installer\LanBridge.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compile failed' }
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: LanBridge-windows-installer
          path: artifacts/setup/*.exe
      - name: Upload self-contained Windows application
        uses: actions/upload-artifact@v4
        with:
          name: LanBridge-win-x64-publish
          path: artifacts/publish
